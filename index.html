      for(let i=0;i<all.length;i++){
        let e=es.find(x=>x.name===all[i]);
        if(!e){let r=await sb.from("exercises").insert({workout_id:w.id,name:all[i],position:i+1}).select().single();if(r.error)throw r.error;e=r.data;es.push(e)}
        cloud.exercises[key+":"+n][all[i]]=e.id;
      }
    }
  }
}
async function ensureCloudExercise(name,pos){
  const k=profile+":"+cur; if(cloud.exercises[k]&&cloud.exercises[k][name])return cloud.exercises[k][name];
  const wid=cloud.workouts[k]; let r=await sb.from("exercises").insert({workout_id:wid,name,position:pos}).select().single();
  if(r.error)throw r.error;if(!cloud.exercises[k])cloud.exercises[k]={};cloud.exercises[k][name]=r.data.id;return r.data.id;
}
async function saveCloud(ex,exerciseNotes,generalNotes){return saveCloudAt(ex,exerciseNotes,generalNotes,new Date().toISOString())}

async function fetchCloudHistory(p){
  const pid=cloud.profiles[p]; if(!pid)return [];
  const {data:sessions,error}=await sb.from("workout_sessions").select("id,workout_id,performed_at,notes").eq("profile_id",pid).order("performed_at",{ascending:true});
  if(error)throw error;
  const out=[];
  for(const sess of sessions){
    const wn=Number(Object.entries(cloud.workouts).find(([k,v])=>k.startsWith(p+":")&&v===sess.workout_id)?.[0].split(":")[1]||0);
    const {data:es,error:ee}=await sb.from("exercise_sessions").select("id,exercise_name,notes,position").eq("session_id",sess.id).order("position");
    if(ee)throw ee;
    let exercises={},exerciseNotes={};
    for(const e of es){
      const {data:sets,error:se}=await sb.from("exercise_sets").select("set_number,weight,reps").eq("exercise_session_id",e.id).order("set_number");
      if(se)throw se;
      exercises[e.exercise_name]=(sets||[]).map(x=>({kg:x.weight==null?"":String(x.weight),reps:x.reps==null?"":String(x.reps)}));
      exerciseNotes[e.exercise_name]=e.notes||"";
    }
    out.push({workout:wn,date:sess.performed_at,exercises,exerciseNotes,notes:sess.notes||"",cloudId:sess.id});
  }
  cloud.history[p]=out; return out;
}
async function importLocalHistoryOnce(){
  const flag="salitreeni-cloud-migrated-v1";
  if(localStorage.getItem(flag)==="1")return;
  const oldProfile=profile; profile="jarkko";
  const d=load(),hist=d.history||[];
  profile=oldProfile;
  if(!hist.length){localStorage.setItem(flag,"1");return}
  await fetchCloudHistory("jarkko");
  const existing=cloud.history.jarkko;
  let imported=0;
  for(const h of hist){
    // Avoid duplicates from the period where v3.2 already dual-saved to local + cloud.
    const dup=existing.some(c=>c.workout===h.workout && Math.abs(new Date(c.date)-new Date(h.date))<120000);
    if(dup)continue;
    const saveProfile=profile,saveCur=cur; profile="jarkko";cur=h.workout;
    await saveCloudAt(h.exercises||{},h.exerciseNotes||{},h.notes||"",h.date);
    profile=saveProfile;cur=saveCur; imported++;
  }
  await fetchCloudHistory("jarkko");
  localStorage.setItem(flag,"1");
  localStorage.setItem("salitreeni-cloud-import-count",String(imported));
}
async function saveCloudAt(ex,exerciseNotes,generalNotes,performedAt){
  const pid=cloud.profiles[profile],wid=cloud.workouts[profile+":"+cur];
  if(!pid||!wid)throw new Error("Pilvirakenne ei ole valmis");
  let r=await sb.from("workout_sessions").insert({profile_id:pid,workout_id:wid,performed_at:performedAt||new Date().toISOString(),notes:generalNotes}).select().single();
  if(r.error)throw r.error; const sid=r.data.id;
  let pos=0;
  for(const [name,sets] of Object.entries(ex)){
    pos++; const eid=await ensureCloudExercise(name,pos);
    let er=await sb.from("exercise_sessions").insert({session_id:sid,exercise_id:eid,exercise_name:name,position:pos,notes:exerciseNotes[name]||null}).select().single();
    if(er.error)throw er.error;
    const rows=sets.map((x,i)=>({exercise_session_id:er.data.id,set_number:i+1,weight:x.kg===""?null:Number(String(x.kg).replace(",",".")),reps:x.reps===""?null:Number(x.reps)})).filter(x=>x.weight!==null||x.reps!==null);
    if(rows.length){let sr=await sb.from("exercise_sets").insert(rows);if(sr.error)throw sr.error}
  }
  return sid;
}
function cloudLastEntry(n,x){
  const h=cloud.history[profile]||[];for(let i=h.length-1;i>=0;i--)if(h[i].workout===n&&h[i].exercises[x])return h[i];return null
}

async function doLogin(){
  loginMsg.textContent="Kirjaudutaan…";loginBtn.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
  if(error){loginMsg.textContent="Kirjautuminen epäonnistui: "+error.message;loginBtn.disabled=false;return}
  try{await ensureCloudStructure();loginMsg.textContent="Tarkistetaan vanha historia…";await importLocalHistoryOnce();await fetchCloudHistory("jarkko");await fetchCloudHistory("ina");showProfiles()}catch(e){loginMsg.textContent="Yhteys/migraatio epäonnistui: "+e.message}
  loginBtn.disabled=false;
}
function showProfiles(){login.style.display="none";home.style.display="none";detail.style.display="none";profiles.style.display="block";password.value="";scrollTo(0,0)}
function fatal(msg){
  login.style.display="block";profiles.style.display="none";home.style.display="none";detail.style.display="none";
  loginMsg.textContent=msg;
}
async function boot(){
  login.style.display="block";
  loginMsg.textContent="Yhdistetään Supabaseen…";
  if(!sb){fatal("Supabase-kirjasto ei latautunut. Tarkista verkkoyhteys ja päivitä sivu.");return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){login.style.display="block";loginMsg.textContent="";return}
  try{await ensureCloudStructure();loginMsg.textContent="Tarkistetaan vanha historia…";await importLocalHistoryOnce();await fetchCloudHistory("jarkko");await fetchCloudHistory("ina");showProfiles()}catch(e){login.style.display="block";loginMsg.textContent="Supabase/migraatiovirhe: "+e.message}
}

historyBtn.onclick=showHistory;historyBack.onclick=()=>{history.style.display="none";home.style.display="block"};historyDetailBack.onclick=showHistory;exerciseHistoryBack.onclick=showHistory;
loginBtn.onclick=doLogin;password.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});logoutBtn.onclick=async()=>{await sb.auth.signOut();profiles.style.display="none";home.style.display="none";detail.style.display="none";login.style.display="block";loginMsg.textContent=""};
document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=async()=>await chooseProfile(b.dataset.profile));profileBack.onclick=toProfiles;document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>openW(+b.dataset.n));back.onclick=goHome;saveBtn.onclick=saveW;
addExercise.onclick=()=>{let name=prompt("Liikkeen nimi");if(!name||!name.trim())return;name=name.trim();if(names(cur).some(x=>x.toLowerCase()===name.toLowerCase()))return alert("Liike on jo tässä treenissä.");let d=load();d.custom[cur].push(name);store(d);exercises.appendChild(card(name));saveOrder()};
boot().catch(e=>fatal("Käynnistysvirhe: "+e.message));
window.addEventListener("error",e=>fatal("Sovellusvirhe: "+e.message));
if("serviceWorker"in navigator){
  window.addEventListener("load",async()=>{
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
      await navigator.serviceWorker.register("./sw.js?v=360");
    }catch(e){}
  });
}
